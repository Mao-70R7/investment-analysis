版本: 1
说明: >
  本文件说明策略治理/持仓闭合一致性校验使用的主治理状态优先级。
  校验脚本只读分析库，不回写主库；当同一策略命中多个治理信号时，按下列顺序取唯一主治理状态。

主治理状态优先级:
  - 优先级: 1
    状态: 测试/剔除
    含义: 测试、演示、内部验证或非正式组合，不进入常规排名和经营对比。
    典型命中条件:
      - 策略治理标签.是否测试组合 = 1
      - 策略名称或状态命中“测试、test、内部测试、演示”等关键词
  - 优先级: 2
    状态: 信号服务
    含义: 以买入、卖出、加仓、减仓、发车、止盈等指令为主要服务形态，不按普通组合仓位解释。
    典型命中条件:
      - 策略治理标签.是否信号类组合 = 1
      - 信号策略事件或信号策略基金指令存在该策略记录
  - 优先级: 3
    状态: 已停止/到期
    含义: 已停止、终止、下架、到期、期满、清盘或历史期次策略，不应混入当前运行榜单。
    典型命中条件:
      - 策略治理标签.是否已停止 = 1
      - 策略状态或治理状态命中“stopped、终止、停止、下架、到期、期满、清盘、结束”等关键词
      - 截至分析日期，官方策略日度业绩/产品披露净值超过 31 天未更新；标准模拟净值不得替代官方业绩判断生命周期
  - 优先级: 4
    状态: 目标盈期次
    含义: 目标盈、小目标、小赢家、小杏运、小盈加、智盈、止盈、目标收益、达标或期次型产品，应按生命周期/期次口径单独观察。
    典型命中条件:
      - 策略治理标签.是否目标盈期次 = 1
      - 策略名称、类型、标签或描述命中“目标盈、小目标、小赢家、小杏运、小盈加、智盈、止盈、目标收益、达标、期满、到期”等关键词
  - 优先级: 5
    状态: 持仓不完整
    含义: 当前基金级权重未披露、为空、合计明显偏离 100%，或只能依赖推算补齐后才可比较。
    典型命中条件:
      - 治理状态为“当前基金权重未完整披露”
      - 最新原始当前持仓基金权重缺失、合计为 0，或合计偏离 100% 超过容忍阈值
  - 优先级: 6
    状态: 常规运行
    含义: 未命中前述特殊治理状态，按普通投顾组合进入常规运行和排名分析。

持仓闭合规则:
  权重闭合目标_百分比: 100.0
  容忍偏差_百分点: 1.0
  可比较口径:
    - 原始当前持仓基金权重闭合
    - 原始当前持仓不闭合但推算补齐持仓闭合
  不可比较口径:
    - 原始当前持仓和推算补齐持仓均缺失
    - 两类持仓均无有效正权重
    - 两类持仓权重合计均偏离 100% 超过容忍偏差

日期滞后规则:
  参照口径: 使用本次分析库内同类字段的最大日期作为横向参照。
  业绩滞后阈值_天: 5
  持仓滞后阈值_天: 5
  调仓滞后阈值_天: 180
  清盘策略业绩停更阈值_天: 31
  清盘口径: 仅使用策略日度业绩和策略产品披露净值的最新日期，不使用策略标准业绩净值或策略模拟净值
  业绩异常隔离口径: 官方策略日度业绩出现非正净值或绝对日收益超过 50% 时，不删除原始记录，但必须退出常规排名等待复核
  适用范围: 默认关注纳入常规排名且非测试、非信号、非已停止的策略。
