# 基金分类穿透规则
# 目的：
#   1. 把基金季报里的“基金”“其他”等会误导资产暴露的占比，按基金标准分类、跟踪指数和名称关键词重映射。
#   2. 解决债券指数、黄金 ETF 联接、QDII/FOF 等基金在第一层季报资产配置中被误归为权益或“基金/其他”的问题。
#   3. 本配置只用于本地 SQLite 分析库，不联网，不调用外部服务。

版本: 1
说明: >
  规则按“优先级”从上到下命中。固收关键词优先于指数型标签：
  只要名称、跟踪指数、标准分类或投顾分类桶出现中债、国开债、政金债、
  政策性金融债、农发债、信用债、固收等关键词，就先按固收暴露处理，
  不因为“指数”“ETF”“联接”而落到权益指数。

阈值:
  # 季报资产暴露中“基金+其他”达到该占比时，校验报告会纳入“高占比但已重映射”统计。
  基金其他高占比阈值: 30
  # 输出经济暴露中仍为“其他/多资产FOF/未分类”的占比达到该阈值时，进入人工补充列表。
  人工补充占比阈值: 30

优先级:
  - 规则代码: 固收优先
    说明: >
      货币、短债、纯债、债券指数、政金债等固收类别优先于指数/ETF。
      重点覆盖中债、国开债、政金债、政策性金融债、农发债、信用债、固收等关键词。
    标准资产大类: 固收
    默认经济暴露: 债券
    关键词:
      - 货币
      - 现金
      - 同业存单
      - 短债
      - 中短债
      - 纯债
      - 债券
      - 债券指数
      - 中债
      - 国债
      - 地方债
      - 国开债
      - 国开
      - 政金债
      - 政策性金融债
      - 农发债
      - 进出债
      - 信用债
      - 利率债
      - 固收
      - 可转债

  - 规则代码: 黄金商品
    说明: >
      黄金 ETF、黄金 ETF 联接、商品基金优先使用标准资产映射。
      若季报显示为“基金/其他”，重映射为黄金或商品暴露。
    标准资产大类: 商品
    默认经济暴露: 黄金
    关键词:
      - 黄金
      - 上海金
      - 商品
      - 白银
      - 原油
      - 油气
      - 豆粕
      - 有色
      - 资源

  - 规则代码: QDII债券
    说明: >
      QDII 债券、美元债、海外债等按海外债券处理，不落入 QDII 权益。
    标准资产大类: 固收
    默认经济暴露: 海外债券
    关键词:
      - QDII债
      - 海外债
      - 美元债
      - 中资美元债
      - 亚洲债
      - 全球债券
      - 亚太债

  - 规则代码: 互认基金权益
    说明: >
      香港互认基金不能因为投顾比较桶含“海外/QDII”而被标成QDII。
      仅在标准分类已明确为权益时，按海外权益处理并保留互认基金身份。
    标准资产大类: 权益
    默认经济暴露: 海外权益
    关键词:
      - 互认基金

  - 规则代码: QDII权益
    说明: >
      QDII 权益基金按跟踪市场或名称归入美股、港股、新兴市场或海外权益。
    标准资产大类: 权益
    默认经济暴露: 海外权益
    关键词:
      - QDII
      - 纳斯达克
      - 纳指
      - 标普
      - S&P
      - 道琼斯
      - 恒生
      - 港股
      - 香港
      - 美股
      - 美国
      - 全球股票
      - 新兴市场
      - 越南
      - 印度
      - 东盟

  - 规则代码: 权益指数ETF联接
    说明: >
      权益指数、ETF、ETF 联接优先根据跟踪指数/名称映射为对应权益市场。
      ETF 联接季报中的“基金/其他”不直接作为最终经济暴露。
    标准资产大类: 权益
    默认经济暴露: A股
    关键词:
      - ETF联接
      - 联接
      - ETF
      - 指数
      - 沪深300
      - 中证500
      - 中证1000
      - 创业板
      - 科创
      - 双创
      - 红利
      - 央企

  - 规则代码: FOF_QDII_FOF
    说明: >
      FOF、养老目标、目标日期、目标风险、QDII-FOF 单独标记。
      没有底层基金明细时，先按名称/标准分类兜底为固收、权益、海外权益或多资产 FOF，
      不把季报“基金/其他”直接当作最终暴露。
    标准资产大类: FOF/多资产
    默认经济暴露: 多资产FOF
    关键词:
      - FOF
      - 基金中基金
      - 养老
      - 目标日期
      - 目标风险
      - 稳健养老
      - 平衡养老
