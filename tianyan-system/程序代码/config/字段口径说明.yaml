版本: 1
名称: 全市场投顾监控字段口径说明
说明: >
  本配置按业务实体维护字段来源、标准口径、覆盖率纳入口径和重要性。
  覆盖率校验脚本以字段自身的来源表为准，不把经营洞察衍生指标挂到策略主表统计。

标准字段来源:
  投顾费率:
    标准来源表: 策略基准费率状态
    标准文本字段: 投顾费率文本
    标准数值字段: 年化投顾费率_百分比
    口径说明: >
      前端、字段字典和数据质量覆盖率以策略基准费率状态中的投顾费率文本、
      年化投顾费率_百分比为标准。策略信息.投顾费率仅作为采集源字段保留，
      不作为覆盖率主指标。
    源字段:
      - 来源表: 策略信息
        来源字段: 投顾费率
        用途: 原始采集留痕
  业绩基准:
    标准来源表: 策略基准费率状态
    标准文本字段: 业绩基准文本
    标准状态字段: 基准可用状态
    口径说明: >
      业绩基准以策略基准费率状态中的业绩基准文本和基准可用状态为准。
      策略信息.业绩基准仅作为采集源字段保留，不作为覆盖率主指标。
    源字段:
      - 来源表: 策略信息
        来源字段: 业绩基准
        用途: 原始采集留痕

实体:
  - 实体: 策略主表
    说明: 策略静态信息、治理标签和标准费率基准状态，粒度为每个统一策略一行。
    主表: 策略信息
    目标表:
      - 策略信息
      - 策略基准费率状态
      - 策略治理标签
    主键:
      - 统一策略ID
    粒度: 每策略一行
    字段:
      - 字段名: 统一策略ID
        中文名: 统一策略ID
        来源表: 策略信息
        来源字段: 统一策略ID
        类型: 主键
        重要性: 核心
        最低非空率: 1.0
        口径: 渠道ID与渠道策略ID拼接后的全库唯一策略标识。
      - 字段名: 渠道ID
        中文名: 渠道ID
        来源表: 策略信息
        来源字段: 渠道ID
        类型: 维度
        重要性: 核心
        最低非空率: 1.0
        口径: 策略来源渠道编码。
      - 字段名: 渠道策略ID
        中文名: 渠道策略ID
        来源表: 策略信息
        来源字段: 渠道策略ID
        类型: 维度
        重要性: 核心
        最低非空率: 1.0
        口径: 渠道侧原始策略编码。
      - 字段名: 策略名称
        中文名: 策略名称
        来源表: 策略信息
        来源字段: 策略名称
        类型: 维度
        重要性: 核心
        最低非空率: 1.0
        口径: 渠道披露的策略或组合名称。
      - 字段名: 投顾机构
        中文名: 投顾机构
        来源表: 策略信息
        来源字段: 投顾机构
        类型: 维度
        重要性: 重要
        最低非空率: 0.9
        口径: 策略管理或投顾机构名称。
      - 字段名: 策略类型
        中文名: 策略类型
        来源表: 策略信息
        来源字段: 策略类型
        类型: 分类
        重要性: 重要
        最低非空率: 0.8
        口径: 渠道披露或治理推断的策略类型。
      - 字段名: 风险等级
        中文名: 风险等级
        来源表: 策略信息
        来源字段: 风险等级
        类型: 分类
        重要性: 一般
        口径: 渠道披露的风险等级。
      - 字段名: 成立日期
        中文名: 成立日期
        来源表: 策略信息
        来源字段: 成立日期
        类型: 日期
        重要性: 重要
        最低非空率: 0.8
        口径: 策略成立或上线日期。
      - 字段名: 建议持有时长
        中文名: 建议持有时长
        来源表: 策略信息
        来源字段: 建议持有时长
        类型: 文本
        重要性: 一般
        口径: 渠道披露的建议持有期限。
      - 字段名: 起投金额
        中文名: 起投金额
        来源表: 策略信息
        来源字段: 起投金额
        类型: 金额
        重要性: 一般
        口径: 渠道披露的最低起投金额。
      - 字段名: 策略状态
        中文名: 策略状态
        来源表: 策略信息
        来源字段: 策略状态
        类型: 状态
        重要性: 重要
        最低非空率: 0.8
        口径: 策略当前有效、停止或其他生命周期状态。
      - 字段名: 策略描述
        中文名: 策略描述
        来源表: 策略信息
        来源字段: 策略描述
        类型: 文本
        重要性: 一般
        口径: 渠道披露的策略说明。
      - 字段名: 标准投顾费率文本
        中文名: 标准投顾费率文本
        来源表: 策略基准费率状态
        来源字段: 投顾费率文本
        类型: 文本
        重要性: 核心
        最低非空率: 0.95
        标准字段: true
        口径: 标准投顾费率披露文本，覆盖率主指标以此字段为准。
      - 字段名: 标准年化投顾费率_百分比
        中文名: 标准年化投顾费率_百分比
        来源表: 策略基准费率状态
        来源字段: 年化投顾费率_百分比
        类型: 比例
        重要性: 核心
        最低非空率: 0.95
        标准字段: true
        口径: 从标准投顾费率文本解析得到的年化百分比数值。
      - 字段名: 费率状态
        中文名: 费率状态
        来源表: 策略基准费率状态
        来源字段: 费率状态
        类型: 状态
        重要性: 重要
        最低非空率: 0.95
        口径: 投顾费率是否可用、缺失或待补采的治理状态。
      - 字段名: 标准业绩基准文本
        中文名: 标准业绩基准文本
        来源表: 策略基准费率状态
        来源字段: 业绩基准文本
        类型: 文本
        重要性: 核心
        最低非空率: 0.85
        标准字段: true
        口径: 标准业绩基准披露文本，覆盖率主指标以此字段为准。
      - 字段名: 基准可用状态
        中文名: 基准可用状态
        来源表: 策略基准费率状态
        来源字段: 基准可用状态
        类型: 状态
        重要性: 核心
        最低非空率: 0.95
        标准字段: true
        口径: 业绩基准文本与基准曲线综合可用状态。
      - 字段名: 原始投顾费率
        中文名: 原始投顾费率
        来源表: 策略信息
        来源字段: 投顾费率
        类型: 源字段
        重要性: 留痕
        纳入覆盖率: false
        口径: 原始采集字段，仅用于追溯，不作为费率覆盖率主指标。
      - 字段名: 原始业绩基准
        中文名: 原始业绩基准
        来源表: 策略信息
        来源字段: 业绩基准
        类型: 源字段
        重要性: 留痕
        纳入覆盖率: false
        口径: 原始采集字段，仅用于追溯，不作为基准覆盖率主指标。
      - 字段名: 是否纳入常规排名
        中文名: 是否纳入常规排名
        来源表: 策略治理标签
        来源字段: 是否纳入常规排名
        类型: 标记
        重要性: 重要
        最低非空率: 0.9
        口径: 治理后是否进入常规策略排名和对比池。
      - 字段名: 治理状态
        中文名: 治理状态
        来源表: 策略治理标签
        来源字段: 治理状态
        类型: 状态
        重要性: 重要
        最低非空率: 0.9
        口径: 策略生命周期、测试组合、信号组合等治理状态。

  - 实体: 策略关系
    说明: 母策略与期次子策略的可追溯关系，按官方业绩、持仓和调仓分别记录可复用的数据来源。
    主表: 策略关系
    目标表:
      - 策略关系
    主键:
      - 子策略ID
    粒度: 每个已识别子策略一行
    字段:
      - 字段名: 子策略ID
        来源表: 策略关系
        来源字段: 子策略ID
        类型: 主键
        重要性: 核心
        最低非空率: 1.0
        口径: 期次或实例策略的统一策略ID，不能仅凭名称中的第X期生成关系。
      - 字段名: 母策略ID
        来源表: 策略关系
        来源字段: 母策略ID
        类型: 维度
        重要性: 核心
        最低非空率: 1.0
        口径: 由渠道产品类型、说明书、长周期曲线和组合运作证据共同确认的主策略。
      - 字段名: 官方业绩策略ID
        来源表: 策略关系
        来源字段: 官方业绩策略ID
        类型: 数据来源
        重要性: 核心
        口径: 仅在长周期官方曲线高度一致时填写；页面展示为母策略共享披露业绩，不作为子策略独立净值。
      - 字段名: 持仓策略ID
        来源表: 策略关系
        来源字段: 持仓策略ID
        类型: 数据来源
        重要性: 重要
        口径: 仅在最新持仓基金与权重指纹一致时填写，不随官方业绩关系自动继承。
      - 字段名: 调仓策略ID
        来源表: 策略关系
        来源字段: 调仓策略ID
        类型: 数据来源
        重要性: 重要
        口径: 仅在历史调仓日期序列一致时填写，不随官方业绩关系自动继承。
      - 字段名: 置信分
        来源表: 策略关系
        来源字段: 置信分
        类型: 质量
        重要性: 重要
        最低非空率: 1.0
        口径: 产品类型与说明书为基础证据，官方曲线、持仓和调仓匹配继续加分；低分或并列候选不自动生效。
      - 字段名: 证据JSON
        来源表: 策略关系
        来源字段: 证据JSON
        类型: 证据
        重要性: 重要
        最低非空率: 1.0
        口径: 保存产品类型、说明书名称、曲线重合率与指纹、持仓和调仓指纹，供复核与回溯。
      - 字段名: 关系状态
        来源表: 策略关系
        来源字段: 关系状态
        类型: 状态
        重要性: 核心
        最低非空率: 1.0
        口径: active 才允许页面按关系取数；连续两次证据不一致后转 review，单次异常只告警不阻断全量更新。

  - 实体: 策略业绩
    说明: 策略披露业绩、标准模拟净值和披露口径对比，粒度为策略日期或策略区间。
    主表: 策略日度业绩
    目标表:
      - 策略日度业绩
      - 策略标准业绩净值
      - 策略产品披露净值
      - 策略区间业绩
      - 策略业绩口径对比
    主键:
      - 统一策略ID
      - 交易日期
    粒度: 每策略每日或每策略区间一行
    字段:
      - 字段名: 统一策略ID
        来源表: 策略日度业绩
        来源字段: 统一策略ID
        类型: 主键
        重要性: 核心
        最低非空率: 1.0
        口径: 业绩记录所属策略。
      - 字段名: 交易日期
        来源表: 策略日度业绩
        来源字段: 交易日期
        类型: 日期
        重要性: 核心
        最低非空率: 1.0
        口径: 策略日度业绩交易日期。
      - 字段名: 单位净值
        来源表: 策略日度业绩
        来源字段: 单位净值
        类型: 净值
        重要性: 核心
        最低非空率: 0.95
        口径: 渠道披露或标准化后的策略单位净值。
      - 字段名: 日收益率_百分比
        来源表: 策略日度业绩
        来源字段: 日收益率_百分比
        类型: 比例
        重要性: 核心
        最低非空率: 0.9
        口径: 策略当日收益率，单位为百分点。
      - 字段名: 累计收益率_百分比
        来源表: 策略日度业绩
        来源字段: 累计收益率_百分比
        类型: 比例
        重要性: 核心
        最低非空率: 0.9
        口径: 策略自披露起点以来的累计收益率，单位为百分点。
      - 字段名: 基准收益率_百分比
        来源表: 策略日度业绩
        来源字段: 基准收益率_百分比
        类型: 比例
        重要性: 重要
        最低非空率: 0.5
        口径: 策略披露或补齐的日度基准收益率。
      - 字段名: 最大回撤_百分比
        来源表: 策略日度业绩
        来源字段: 最大回撤_百分比
        类型: 比例
        重要性: 重要
        最低非空率: 0.5
        口径: 策略披露或计算的历史最大回撤。
      - 字段名: 标准费后单位净值
        来源表: 策略标准业绩净值
        来源字段: 标准费后单位净值
        类型: 净值
        重要性: 核心
        最低非空率: 0.9
        口径: 按统一调仓、净值和投顾费率算法回放得到的费后单位净值。
      - 字段名: 标准费前单位净值
        来源表: 策略标准业绩净值
        来源字段: 标准费前单位净值
        类型: 净值
        重要性: 重要
        最低非空率: 0.9
        口径: 按统一算法回放但不扣投顾费的单位净值。
      - 字段名: 标准费后累计收益率_百分比
        来源表: 策略标准业绩净值
        来源字段: 标准费后累计收益率_百分比
        类型: 比例
        重要性: 核心
        最低非空率: 0.9
        口径: 标准费后净值对应累计收益率。
      - 字段名: 标准费前累计收益率_百分比
        来源表: 策略标准业绩净值
        来源字段: 标准费前累计收益率_百分比
        类型: 比例
        重要性: 重要
        最低非空率: 0.9
        口径: 标准费前净值对应累计收益率。
      - 字段名: 当日投顾费_元
        来源表: 策略标准业绩净值
        来源字段: 当日投顾费_元
        类型: 金额
        重要性: 重要
        最低非空率: 0.5
        口径: 标准回放当日扣除的投顾费金额。
      - 字段名: 披露单位净值
        来源表: 策略产品披露净值
        来源字段: 披露单位净值
        类型: 净值
        重要性: 重要
        最低非空率: 0.8
        口径: 产品披露区的单位净值。
      - 字段名: 产品披露区间收益率_百分比
        来源表: 策略业绩口径对比
        来源字段: 产品披露区间收益率_百分比
        类型: 比例
        重要性: 重要
        最低非空率: 0.8
        口径: 策略披露净值与标准回放可比区间内的披露收益率。

  - 实体: 当前持仓
    说明: 当前披露持仓、分组和推算补齐持仓，粒度为策略、日期、基金。
    主表: 策略当前持仓
    目标表:
      - 策略当前持仓
      - 策略当前持仓分组
      - 策略当前持仓推算补齐
      - 最新持仓推算稽核基金明细
    主键:
      - 统一策略ID
      - 持仓日期
      - 基金代码
    粒度: 每策略每持仓日每基金一行
    字段:
      - 字段名: 统一策略ID
        来源表: 策略当前持仓
        来源字段: 统一策略ID
        类型: 主键
        重要性: 核心
        最低非空率: 1.0
        口径: 当前持仓所属策略。
      - 字段名: 持仓日期
        来源表: 策略当前持仓
        来源字段: 持仓日期
        类型: 日期
        重要性: 核心
        最低非空率: 1.0
        口径: 当前持仓对应仓位日期。
      - 字段名: 披露日期
        来源表: 策略当前持仓
        来源字段: 披露日期
        类型: 日期
        重要性: 重要
        最低非空率: 0.8
        口径: 持仓信息被渠道披露或采集的日期。
      - 字段名: 基金代码
        来源表: 策略当前持仓
        来源字段: 基金代码
        类型: 主键
        重要性: 核心
        最低非空率: 0.95
        口径: 当前持仓基金代码。
      - 字段名: 基金名称
        来源表: 策略当前持仓
        来源字段: 基金名称
        类型: 维度
        重要性: 核心
        最低非空率: 0.95
        口径: 当前持仓基金名称。
      - 字段名: 资产类型
        来源表: 策略当前持仓
        来源字段: 资产类型
        类型: 分类
        重要性: 重要
        最低非空率: 0.8
        口径: 渠道披露的基金资产类型。
      - 字段名: 分组名称
        来源表: 策略当前持仓
        来源字段: 分组名称
        类型: 分类
        重要性: 一般
        口径: 策略持仓分组名称。
